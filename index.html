<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Enlaces | DevProfile</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
        }
        body {
            background: var(--bg-color) url("fondo2.jpg") center / cover no-repeat fixed;
            color: var(--text-color);
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: calc(2rem + 20vh) 1rem 2rem;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .profile {
            text-align: center;
            margin-bottom: 2rem;
        }
        .profile img {
            width: 96px;
            height: 96px;
            border-radius: 50%;
        }
        .links-container {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .link-card {
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.1),
                rgba(255, 255, 255, 0.06) 50%,
                rgba(255, 255, 255, 0.1)
            );
            color: var(--text-color);
            text-decoration: none;
            padding: 1rem;
            text-align: center;
            border-radius: 18px;
            font-weight: 600;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.4),
                0 8px 24px rgba(15, 23, 42, 0.2);
            -webkit-backdrop-filter: blur(14px) saturate(160%);
            backdrop-filter: blur(14px) saturate(160%);
        }
        .link-card:hover {
            background: linear-gradient(
                135deg,
                rgba(255, 255, 255, 0.1),
                rgba(255, 255, 255, 0.06) 50%,
                rgba(255, 255, 255, 0.1)
            );
            transform: translateY(-2px);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5),
                0 12px 28px rgba(15, 23, 42, 0.28);
        }
    </style>
</head>
<body>

    <div class="profile">
        <img src="foto.jpg" alt="Foto de perfil">
        <h2>@jesusmonttt</h2>
        <p>Software Engineer</p>
    </div>

    <div class="links-container">
        <a href="https://github.com/tu-usuario" target="_blank" class="link-card">GitHub</a>
        <a href="https://linkedin.com/in/tu-usuario" target="_blank" class="link-card">LinkedIn</a>
        <a href="https://juanmonteroglez-commits.github.io/Portafolio/" target="_blank" class="link-card">Portafolio Web</a>
        <a href="https://twitter.com/tu-usuario" target="_blank" class="link-card">Twitter / X</a>
    </div>

</body>
</html>
